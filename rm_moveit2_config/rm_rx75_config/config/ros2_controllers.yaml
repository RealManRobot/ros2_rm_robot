# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolate_from_desired_state: true
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      left_joint1:
        trajectory: 0.05
        goal: 0.03
      left_joint2:
        trajectory: 0.05
        goal: 0.03
      left_joint3:
        trajectory: 0.05
        goal: 0.03
      left_joint4:
        trajectory: 0.05
        goal: 0.03
      left_joint5:
        trajectory: 0.05
        goal: 0.03
      left_joint6:
        trajectory: 0.05
        goal: 0.03
      left_joint7:
        trajectory: 0.05
        goal: 0.03

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolate_from_desired_state: true
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      right_joint1:
        trajectory: 0.05
        goal: 0.03
      right_joint2:
        trajectory: 0.05
        goal: 0.03
      right_joint3:
        trajectory: 0.05
        goal: 0.03
      right_joint4:
        trajectory: 0.05
        goal: 0.03
      right_joint5:
        trajectory: 0.05
        goal: 0.03
      right_joint6:
        trajectory: 0.05
        goal: 0.03
      right_joint7:
        trajectory: 0.05
        goal: 0.03
