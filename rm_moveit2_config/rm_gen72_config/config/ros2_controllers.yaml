# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    rm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

rm_group_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolate_from_desired_state: true
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      joint1:
        trajectory: 0.05
        goal: 0.03
      joint2:
        trajectory: 0.05
        goal: 0.03
      joint3:
        trajectory: 0.05
        goal: 0.03
      joint4:
        trajectory: 0.05
        goal: 0.03
      joint5:
        trajectory: 0.05
        goal: 0.03
      joint6:
        trajectory: 0.05
        goal: 0.03
      joint7:
        trajectory: 0.05
        goal: 0.03
